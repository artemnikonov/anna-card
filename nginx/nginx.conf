user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    server_tokens off;  # no nginx version in headers and error pages
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Brotli (if available via nginx-module-brotli)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # One Cache-Control per request type. add_header lives only at server level,
    # because any add_header inside a location drops all server-level headers.
    map $uri $cache_control {
        ~^/stats/                                   "";
        ~^/_astro/                                  "public, max-age=31536000, immutable";
        ~*\.(woff2?|jpg|jpeg|png|gif|ico|svg|webp|avif)$ "public, max-age=2592000";
        default                                     "public, max-age=3600, must-revalidate";
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Behind Traefik nginx sees http; relative redirects keep https
        absolute_redirect off;

        add_header Cache-Control $cache_control;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Umami Analytics proxy
        location ^~ /stats/ {
            proxy_pass http://umami:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static site: unknown URLs are real 404s, not the homepage
        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
    }
}
