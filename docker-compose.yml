services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anna-card
    restart: unless-stopped
    networks:
      - web
      - umami_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.anna-card.rule=Host(`annabody.studio`) || Host(`www.annabody.studio`)"
      - "traefik.http.routers.anna-card.entrypoints=websecure"
      - "traefik.http.routers.anna-card.tls=true"
      - "traefik.http.routers.anna-card.tls.certresolver=letsencrypt"
      - "traefik.http.services.anna-card.loadbalancer.server.port=80"
      # Redirect www to non-www
      - "traefik.http.middlewares.anna-www-redirect.redirectregex.regex=^https://www\\.annabody\\.studio/(.*)"
      - "traefik.http.middlewares.anna-www-redirect.redirectregex.replacement=https://annabody.studio/$${1}"
      - "traefik.http.middlewares.anna-www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.anna-card.middlewares=anna-www-redirect"

networks:
  web:
    external: true
  umami_default:
    external: true
